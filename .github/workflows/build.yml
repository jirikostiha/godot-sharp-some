name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - '!src/**.sln' # ignore sln changes
      - '.github/workflows/build.yml' # rebuild when the build workflow changes

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '2.0.x', '6.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # Godot 3.x does not ship GodotSharp on NuGet; the assemblies are normally
      # generated by the editor. Fetch them from the official 3.6 (latest 3.x)
      # mono build and drop them into each project's .mono/assemblies/Debug/,
      # where Godot.NET.Sdk resolves its GodotSharp/GodotSharpEditor references,
      # so 'dotnet build' can compile without a Godot editor present.
      - name: Provide Godot API assemblies
        env:
          godot-url: "https://github.com/godotengine/godot/releases/download/3.6-stable/Godot_v3.6-stable_mono_linux_headless_64.zip"
        run: |
          wget -q -O godot-mono.zip "${{ env.godot-url }}"
          unzip -q godot-mono.zip
          api="Godot_v3.6-stable_mono_linux_headless_64/GodotSharp/Api/Debug"
          for proj in src/GodotSharpSome.Drawing2D src/usage; do
            mkdir -p "$proj/.mono/assemblies/Debug"
            cp "$api/GodotSharp.dll" "$api/GodotSharpEditor.dll" "$proj/.mono/assemblies/Debug/"
          done

      # Build the projects individually rather than the whole solution: both are
      # Godot.NET.Sdk projects and, when built via the shared .sln, GodotProjectDir
      # resolves to the common SolutionDir, so they collide in src/.mono/temp/ and
      # the second project fails to restore. Built on their own, each project gets
      # its own .mono directory. Building the examples also builds the library it
      # references.
      - name: Build library
        run: dotnet build "src/GodotSharpSome.Drawing2D/GodotSharpSome.Drawing2D.csproj"

      - name: Build examples
        run: dotnet build "src/usage/GodotSharpSome.Examples.csproj"
