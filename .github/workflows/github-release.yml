name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true

jobs:
  lint-code: # release gate: lint the exact ref being released
    uses: ./.github/workflows/lint-code.yml
    permissions:
      contents: write
      checks: write
    with:
      check-only: true
      ref: ${{ inputs.tag }}

  lint-docs: # release gate: lint the exact ref being released
    uses: ./.github/workflows/lint-docs.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag }}

  lint-config: # release gate: lint the exact ref being released
    uses: ./.github/workflows/lint-config.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag }}

  build:
    needs: [lint-code, lint-docs, lint-config]
    uses: jirikostiha/ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: "./src/godot sharp some.sln"
      configuration: Release
      ref: ${{ inputs.tag || github.ref_name }}
      artifacts: true
      binaries-path: artf/GodotSharpSome.Drawing2D/bin
      dotnet-version: "8.0.x"

  benchmark:
    needs: build
    uses: jirikostiha/ci/.github/workflows/benchmark.yml@v1
    permissions:
      contents: write
      deployments: write
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      project: src/quality/GodotSharpSome.Drawing2D.Benchmarks
      dotnet-version: "8.0.x"

  docs:
    needs: benchmark
    uses: jirikostiha/ci/.github/workflows/docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    needs: build
    uses: jirikostiha/ci/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish: # last: a nuget.org push cannot be undone, so it waits for the GitHub release
    needs: release
    permissions:
      contents: read
      checks: write # required statically by the (skipped) build job in nuget-publish.yml
      id-token: write
    uses: ./.github/workflows/nuget-publish.yml
    with:
      reuse-artifacts: true # push the packages built above, not a second build

  asset-library:
    needs: publish
    uses: jirikostiha/ci/.github/workflows/godot-publish.yml@v1
    with:
      username: jiri
      asset-id: "7436"
      asset-template: .github/asset-template.json.hb
      ref: ${{ inputs.tag || github.ref_name }}
    secrets:
      password: ${{ secrets.GODOT_ASSET_STORE_PASSWORD }}
