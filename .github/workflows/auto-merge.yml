name: Auto Merge

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: jirikostiha/ci/.github/workflows/auto-merge.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      head-branch: ${{ github.event.workflow_run.head_branch }}
