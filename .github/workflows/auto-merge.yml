name: Auto Merge

on:
  workflow_run:
    # Auto Approve runs on every PR; Build is path-filtered and may not run at all.
    # The reusable workflow waits for every PR check (Build included) before merging.
    workflows: [ "Auto Approve" ]
    types: [ completed ]

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    uses: jirikostiha/ci/.github/workflows/auto-merge.yml@v1
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    with:
      head-branch: ${{ github.event.workflow_run.head_branch }}
