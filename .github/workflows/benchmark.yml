name: Benchmarks

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  benchmark:
    uses: jirikostiha/ci/.github/workflows/benchmark.yml@v1
    permissions:
      contents: write
      deployments: write
    with:
      project: src/quality/GodotSharpSome.Drawing2D.Benchmarks
      dotnet-version: "8.0.x"
